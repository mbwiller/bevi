function showFriends(){showSheet('Find your kind of people',`<p class="detail-note" style="margin-bottom:12px">A few familiar faces with very good taste.</p>${['Arjun','Sophie','Jamie'].map((name,i)=>`<div class="friends-row">${avatar(name,i)}<div class="person"><strong>${name}</strong><p>${[94,89,86][i]}% taste match · ${['Coffee person','Soda enthusiast','Boba devotee'][i]}</p></div><button class="outline-button" data-follow="${name}">${state.following.includes(name)?'Following':'Follow'}</button></div>`).join('')}<p class="search-label">Sample profiles for this design preview.</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.nav){navigate(d.nav);return}if(d.detail){openDetail(d.detail);return}if(d.save){toggleSave(d.save);return}if(d.category){category=d.category;document.querySelector('.categories').innerHTML=categoryMarkup();document.getElementById('posts').innerHTML=feedPosts();return}if(d.feature!==undefined){featureIndex=Number(d.feature);document.getElementById('feature').innerHTML=featureMarkup();return}if(d.feedTab){feedTab=d.feedTab;renderFeed();return}if(d.list){listTab=d.list;renderLists();return}if(d.leaderCategory){leaderCategory=d.leaderCategory;renderLeaderboard();return}if(d.viewRankings!==undefined){listTab='ranked';navigate('lists');return}
 if(d.like){const id=d.like;if(state.likes.includes(id))state.likes=state.likes.filter(x=>x!==id);else state.likes.push(id);persist();b.setAttribute('aria-pressed',String(state.likes.includes(id)));b.querySelector('span').textContent=posts.find(p=>p.id===id).likes+(state.likes.includes(id)?1:0);return}if(d.comments){openComments(d.comments);return}if(d.postMenu){const p=posts.find(p=>p.id===d.postMenu);showSheet(`${p.name}’s good taste`,`<p class="detail-note" style="margin-bottom:20px">${p.name} ranked ${getDrink(p.id).name} ${getDrink(p.id).score.toFixed(1)} out of 10.</p><div class="mood-options"><button class="mood" data-detail="${p.id}">${icon('spark')}<strong>Explore this bev</strong>${icon('chevron')}</button><button class="mood" data-comments="${p.id}">${icon('comment')}<strong>Join the conversation</strong>${icon('chevron')}</button></div>`);return}
 if(d.follow){if(state.following.includes(d.follow))state.following=state.following.filter(n=>n!==d.follow);else state.following.push(d.follow);persist();document.querySelectorAll(`[data-follow="${d.follow}"]`).forEach(el=>el.textContent=state.following.includes(d.follow)?'Following':'Follow');toast(state.following.includes(d.follow)?`You’re now following ${d.follow}`:`Unfollowed ${d.follow}`);return}
 if(d.rank){startRank(d.rank);return}if(d.mood){ranking.bucket=d.mood;ranking.comparisons=state.ranked.filter(id=>id!==ranking.id).slice(0,2);if(ranking.comparisons.length)compare();else finishRank();return}if(d.choose){ranking.results.push(d.choose===ranking.id);ranking.round++;if(ranking.round>=ranking.comparisons.length)finishRank();else compare();return}
 if(d.action==='search')openSearch();if(d.action==='close')closeSheet();if(d.action==='sort'){sortLiked=!sortLiked;renderFeed()}if(d.action==='friends')showFriends();if(d.action==='rank-done'){closeSheet();listTab='ranked';navigate('lists')}if(d.action==='notifications'){document.getElementById('notification-dot').hidden=true;showSheet('A little buzz',`<p class="eyebrow" style="color:var(--muted);margin:4px 0 15px">Your circle, lately</p><div class="comment">${avatar('Arjun',0)}<p><strong>Arjun found a new favorite</strong>His Iced Oat Latte just made the top spot.<br><button class="feature-cta" data-detail="coffee">See the bev ${icon('arrow')}</button></p></div><div class="comment">${avatar('Sophie',2)}<p><strong>A little taste in common</strong>You and Sophie both have a soft spot for a good soda.<br><button class="feature-cta" data-action="friends">Find your people ${icon('arrow')}</button></p></div><p class="search-label">Sample activity · Design preview</p>`)}});
document.addEventListener('input',e=>{if(e.target.id==='drink-search'){const q=e.target.value.trim().toLowerCase();const found=drinks.filter(d=>[d.name,d.maker,d.category,...d.tags].join(' ').toLowerCase().includes(q));document.getElementById('search-label').textContent=q?`${found.length} ${found.length===1?'bev':'bevs'} found`:'A few bevs worth knowing';document.getElementById('search-results').innerHTML=found.length?found.map(d=>row(d)).join(''):`<div class="empty">${icon('search')}<h3>No sips found. Yet.</h3><p>Try “matcha”, “cola”, or “oat milk”.</p></div>`}});
document.addEventListener('submit',e=>{if(e.target.id==='comment-form'){e.preventDefault();const input=e.target.elements.comment;const value=input.value.trim();if(!value)return;state.comments[commentDrink]=[...(state.comments[commentDrink]||[]),value];persist();openComments(commentDrink);if(page==='feed')document.getElementById('posts').innerHTML=feedPosts();document.querySelector('#comment-form input').focus();toast('Comment added to this preview')}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
hydrateIcons();document.getElementById('desktop-art').innerHTML=art('soda')+art('matcha')+art('bottle');render();
</script>
</body>
</html>
