name: backend

# Arjun's lane: supabase/, packages/api/, data/catalog/, scripts/, and shared/
# (shared/ is joint, but changes there still need the db job to pass).
#
# NOTE: as of this PR, none of supabase/, packages/api/, data/catalog/ or a
# root lockfile exist yet in this branch. This workflow defines the CI
# *shape* that later PRs (schema, catalog, packages/api) will fill in.
# `npm ci` will fail until a lockfile exists — that is expected and will
# resolve once more of the scaffold lands.

on:
  pull_request:
    paths:
      - "supabase/**"
      - "packages/api/**"
      - "shared/**"
      - "data/catalog/**"
      - "packages/ranking/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "packages/api/**"
      - "shared/**"
      - "data/catalog/**"
      - "packages/ranking/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Migrations are append-only once merged (supabase/CLAUDE.md): a PR may
      # add migration files but never modify, delete or rename one.
      - name: migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --diff-filter=MDR --name-only "origin/$BASE_REF...HEAD" -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "Merged migrations must not change; add a new one instead:"
            echo "$changed"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Will fail until a root package-lock.json exists (needs more of the
      # workspace scaffold). Not worked around on purpose.
      - run: npm ci

      - run: npm run typecheck -w packages/api

      # Trim the local stack to what CI actually needs. `-x` excludes
      # services; drop any name here the installed CLI version doesn't
      # support.
      - run: supabase start -x studio,imgproxy,inbucket,logflare,vector

      - run: supabase db lint --level warning

      # pgTAP. No-ops cleanly until supabase/tests/*.test.sql exist.
      - run: supabase test db

      # Exposes the local stack's URL/anon key to packages/api's vitest
      # suite as SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY. `-o env` prints
      # shell-quoted `NAME="value"` lines; `eval`-ing them lets bash strip
      # the quotes correctly before the now-clean values go to
      # $GITHUB_ENV (appending the quoted form directly made the URL
      # literally start with a `"` character -- confirmed by this step
      # failing once already).
      - run: |
          eval "$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_PUBLISHABLE_KEY)"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      # vitest against the local stack (packages/api's own tests skip
      # anything needing a live stack if these env vars aren't set).
      - run: npm test -w packages/api

      # Edge Functions run on Deno, which nothing else in this workflow
      # provides. `deno check` is a type-check only -- it reaches no network
      # and needs no NEO4J_* secret.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/graph-query/index.ts

      # graph-query's input-validation tests. They skip when nothing answers
      # on 127.0.0.1:54321, but `supabase start` above already serves every
      # function in supabase/functions, so in CI they do run (with no NEO4J_*
      # set, nothing upstream is ever called).
      - run: deno test --allow-net --allow-env supabase/functions/graph-query/test.ts

      - run: npm run catalog:validate

      # The newest *_catalog_seed.sql migration must match data/catalog
      # (scripts/catalog/build-seed-migration.ts generates it).
      - run: npm run catalog:migration -- --check

  deploy-dev:
    needs: db
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      # Still stubbed, but no longer for the original reason: a hosted
      # Supabase project DOES exist now (#56 put the app on it), so the only
      # thing missing is SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
      # SUPABASE_PROJECT_ID in the dev GitHub Environment.
      #
      # Enabling it is a deliberate decision, not a side effect of adding an
      # Edge Function: `supabase db push` on every main merge would apply
      # migrations to the live database unattended, and some of them (A-01's
      # feed_events cleanup) delete real rows. Turn this on only alongside a
      # backup step and a conscious read of what is pending.
      #
      # `supabase functions deploy --use-api` is listed below because
      # graph-query (A-15) is the first Edge Function in the repo and will
      # need it whenever this job is switched on. It also needs the NEO4J_*
      # secrets set on the project with `supabase secrets set` -- deploying
      # the function does not carry them (docs/graph.md).
      #
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm
      #
      # - uses: supabase/setup-cli@v1
      #   with:
      #     version: latest
      #
      # - run: npm ci
      #
      # - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #
      # - run: supabase db push
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #     SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      #
      # - run: supabase functions deploy --use-api
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - run: |
          echo "deploy-dev is stubbed on purpose: enabling db push needs a backup step first."
          echo "See the comments in this job for what it needs before it can run."
