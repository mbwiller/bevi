name: app

# Matt's lane: the Expo web app in app/. Typecheck, unit tests, expo-doctor and the web export that
# Vercel builds (deploys themselves are manual; see app/CLAUDE.md). Also runs on packages/api and
# data/catalog changes: the app bundles @bevi/api, and its jest FakeApi reads the catalog CSV.

on:
  pull_request:
    paths:
      - "app/**"
      - "shared/src/**"
      - "packages/ranking/src/**"
      - "packages/api/src/**"
      - "data/catalog/**"
      - "package-lock.json"
      - ".github/workflows/app.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "shared/src/**"
      - "packages/ranking/src/**"
      - "packages/api/src/**"
      - "data/catalog/**"
      - "package-lock.json"
      - ".github/workflows/app.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typed routes live in app/.expo/types (gitignored) and are only written by the Expo CLI;
      # without them tsc can't catch a bad href.
      - name: generate route types
        working-directory: app
        run: npx expo customize tsconfig.json

      - run: npm run typecheck -w app

      - run: npm test -w app

      # expo-doctor's dependency-version check compares against Expo's *current* expected versions,
      # so an SDK patch release turned main red with no change of ours (#58, fixed by #63). The
      # other doctor checks stay blocking; the version check is advisory. When it warns, bump with
      # `npx expo install --fix` from app/ in a small ui/* PR (TASKS.md S-18).
      - name: expo-doctor
        working-directory: app
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npx expo-doctor

      - name: expo dependency versions (advisory)
        working-directory: app
        continue-on-error: true
        run: npx expo install --check

      # The same guarded build Vercel runs (vercel.json buildCommand), with placeholder values: the
      # env check, the export, and the scan that fails if test-only or fake content reached dist/.
      - name: web export
        working-directory: app
        env:
          CI: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: node scripts/check-env.mjs && npx expo export --platform web --clear && node scripts/check-bundle.mjs
