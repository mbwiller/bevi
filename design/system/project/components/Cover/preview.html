<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bevi</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .grape { fill: var(--primary); }
  .deep { fill: var(--tasteCard); }
  .tint { fill: var(--primaryTint); }
  .fizz { fill: var(--fizz); }
  .cut { fill: var(--surface); }
  .blk { rx: var(--radius-card); }
  .words { position: absolute; left: var(--space-xxl); bottom: var(--space-xxl); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .tag { margin: var(--space-sm) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--textSecondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 200×272 slab bled off the top (the brand) · tasteCard 264×184 bled off the right (the deep partner) · primaryTint 120×72 bled off the top (relief) · fizz only as bubbles ≈ 45% of 960×288
  arrangement one tall grape slab with a deep satellite and a tint tab, bottoms on one line space-xxl above the edge, space-lg gutters
  pattern     discs, from the wordmark's two bubbles and "pills, radius-pill": bubbles rising and shrinking, cut out of the slab in surface and floating over the deep block in fizz
  scales      sides in space-sm multiples; gutters space-lg; corners radius-card; disc radii space-xs, space-sm, space-md, space-lg, space-xxl
-->
<rect class="grape blk" x="16" y="-16" width="200" height="280" rx="16"/>
<rect class="tint blk" x="232" y="-16" width="120" height="88" rx="16"/>
<rect class="deep blk" x="232" y="88" width="264" height="176" rx="16"/>
<!-- bubbles cut out of the grape slab, rising and shrinking -->
<circle class="cut" cx="92" cy="216" r="24"/>
<circle class="cut" cx="140" cy="168" r="16"/>
<circle class="cut" cx="100" cy="132" r="12"/>
<circle class="cut" cx="148" cy="100" r="8"/>
<circle class="cut" cx="116" cy="72" r="8"/>
<circle class="cut" cx="140" cy="44" r="4"/>
<circle class="cut" cx="108" cy="24" r="4"/>
<!-- fizz over the deep block, and the two loose bubbles that echo the wordmark's dot -->
<circle class="fizz" cx="296" cy="224" r="16"/>
<circle class="fizz" cx="344" cy="192" r="8"/>
<circle class="fizz" cx="320" cy="152" r="12"/>
<circle class="fizz" cx="376" cy="128" r="4"/>
<circle class="fizz" cx="420" cy="208" r="24"/>
<circle class="fizz" cx="400" cy="56" r="12"/>
<circle class="fizz" cx="436" cy="28" r="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Bevi</h1>
<p class="tag">Rank every drink you've ever had.</p>
</div>
</div>
</body>
</html>
