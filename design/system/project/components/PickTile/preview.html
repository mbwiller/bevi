<style>
  body { margin: 0; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .pv { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 20px 16px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .pv-stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .pv-label { font-size: 12px; line-height: 16px; color: var(--textSecondary); }
  .pv-narrow { max-width: 393px; }
  .pv-frame { position: relative; width: 393px; max-width: 100%; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 16px; }
.cell { display: flex; flex-direction: column; gap: 6px; } .cell .bv-pick { flex: 1; }
.cap { margin: 0; padding: 18px 16px 10px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--textSecondary); }
.help { margin: 0; padding: 14px 16px 20px; font-size: 15px; line-height: 20px; color: var(--textSecondary); }</style>
</head>
<body>

      var i = picks.indexOf(c.id);
      return h(B.PickTile, { key: c.id, label: c.label, art: ART[c.id], rank: i >= 0 ? i + 1 : undefined, disabled: i < 0 && picks.length >= 3, onClick: function () { tap(c.id); } });

}));
